name: Complete 0.1.76 platform downloads

on:
  push:
    branches: ['codex/release-0.1.76']
    paths: ['.github/workflows/complete-platform-downloads.yml']

permissions:
  contents: write

concurrency:
  group: complete-0.1.76-platform-downloads
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify published source and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'v0.1.76^{commit}')" = cccdf7697c357fcf44dad9d097dc79177337745a
          gh release view v0.1.76 --json tagName,isDraft,isPrerelease | jq -e '.tagName == "v0.1.76" and .isDraft == false and .isPrerelease == false'
          mkdir -p artifacts/platform-downloads
          gh release download v0.1.76 --dir artifacts/platform-downloads --pattern '*.vsix' --pattern SHA256SUMS.txt
          cd artifacts/platform-downloads
          sha256sum --check SHA256SUMS.txt
          expected=76f898931aa1c9f291a4c3d83446e666a0eba136f9a60d8983363561aec85501
          for file in *.vsix; do
            printf '%s  %s\n' "$expected" "$file" | sha256sum --check -
          done
      - name: Add identical platform downloads
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/platform-downloads
          for platform in windows macos; do
            file="dynsight-0.1.76-$platform.vsix"
            if test ! -f "$file"; then
              cp dynsight-0.1.76.vsix "$file"
              gh release upload v0.1.76 "$file"
            fi
          done
          for file in dynsight-0.1.76-windows.vsix dynsight-0.1.76-macos.vsix dynsight-0.1.76-wsl.vsix c-relation-explorer-0.1.76.vsix; do
            cmp dynsight-0.1.76.vsix "$file"
          done
          mv SHA256SUMS.txt SHA256SUMS.previous
          sha256sum *.vsix > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if ! cmp -s SHA256SUMS.previous SHA256SUMS.txt; then
            gh release upload v0.1.76 SHA256SUMS.txt --clobber
          fi
      - name: Update release download instructions
        run: gh release edit v0.1.76 --title "Dynsight 0.1.76 — Windows / macOS / WSL" --notes-file docs/releases/0.1.76.md
